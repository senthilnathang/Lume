name: Workspace verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-isolated-only
          MYSQL_DATABASE: lume_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-isolated-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:ci-isolated-only@127.0.0.1:3306/lume_ci
      GRAPHQL_TEST_DATABASE_URL: mysql://root:ci-isolated-only@127.0.0.1:3306/lume_ci
      JWT_SECRET: ci-only-not-a-deployment-secret
      AUTOMATION_WORKER_ENABLED: 'false'
      AUTOMATION_DURABLE_EVENTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install -g pnpm@10.28.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @lume/api db:generate
      - run: pnpm --filter @lume/website exec nuxt prepare
      - run: pnpm --filter @lume/api lint
      - run: pnpm --filter @lume/admin lint
      - run: pnpm --filter @lume/website lint
      - run: pnpm --filter @lume/api build
      - run: pnpm --filter @lume/admin typecheck
      - run: pnpm --filter @lume/website typecheck
      - run: pnpm --filter @lume/admin build
      - run: pnpm --filter @lume/website build
      - run: pnpm --filter @lume/api test --runInBand --forceExit
      - run: pnpm --filter @lume/admin test run --maxWorkers=1
      - run: pnpm --filter @lume/website test run --maxWorkers=1
      - run: python3 scripts/check_layout.py
